[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ir-graphrag"
version = "0.1.0"
description = "Source-traceable public company document Q&A with Microsoft GraphRAG"
requires-python = ">=3.11,<3.14"
dependencies = [
  "graphrag==3.2.0",
  "beautifulsoup4>=4.13,<5",
  "pypdf>=6,<7",
  "fonttools>=4.60,<5",
  "openpyxl>=3.1,<4",
  "xlrd>=2,<3",
  "streamlit>=1.65,<2",
]

[project.scripts]
ir-graphrag = "ir_graphrag.cli:main"

[tool.setuptools.packages.find]
include = ["ir_graphrag*"]
